# ==============================================================================
# Synthetic Hyprland Configuration (Unsanitized Fixture for Sanitize Guard)
# Contains hardware monitor EDID descriptors and machine-specific autostart paths.
# ==============================================================================

# Hardware Monitors
monitor=desc:Dell Inc. DELL U2720Q 7ABCD12,3840x2160@60,0x0,1.5
monitor=eDP-1,1920x1080@60,0x1440,1

# Machine Autostart
exec-once = /home/synthuser/.config/hypr/scripts/statusbar.sh
exec-once = /home/synthuser/.config/hypr/scripts/wallpaper.sh

# Environment
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

dwindle {
    pseudotile = true
    preserve_split = true
}
