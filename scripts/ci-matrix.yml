name: CI & DevSecOps Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test & Security Audit (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit & Integration Tests
        run: python -m unittest discover -s tests -v

      - name: Verify Self-Scan on sanitize_guard Package (Zero Findings)
        run: python -m sanitize_guard.cli audit sanitize_guard --format table --fail-on medium

      - name: Verify Detection on Synthetic Samples (SARIF Output)
        run: python -m sanitize_guard.cli audit samples --format sarif

      - name: Run Zero-Leak Repository Security Audit (Linux)
        if: runner.os == 'Linux'
        run: bash ./scripts/security-audit.sh
